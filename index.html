<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psych Roadmap</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("psych-roadmap-theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link sr-only" href="#main">Skip to content</a>

  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="lucide-search" viewBox="0 0 24 24">
        <path d="m21 21-4.34-4.34"></path>
        <circle cx="11" cy="11" r="8"></circle>
      </symbol>
      <symbol id="lucide-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>
      </symbol>
      <symbol id="lucide-moon" viewBox="0 0 24 24">
        <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path>
      </symbol>
      <symbol id="lucide-menu" viewBox="0 0 24 24">
        <path d="M4 5h16"></path>
        <path d="M4 12h16"></path>
        <path d="M4 19h16"></path>
      </symbol>
      <symbol id="lucide-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18"></path>
        <path d="m6 6 12 12"></path>
      </symbol>
    </defs>
  </svg>

  <button class="toc-trigger" id="tocTrigger" type="button" aria-label="Open table of contents" data-tooltip="Open table of contents" aria-haspopup="dialog" aria-controls="tocDrawer" aria-expanded="false">
    <svg class="icon" aria-hidden="true" focusable="false"><use href="#lucide-menu"></use></svg>
  </button>

  <div class="page-tools">
    <button class="spotlight-trigger" id="spotlightTrigger" type="button" aria-label="Open search and commands" aria-haspopup="dialog" aria-controls="spotlightDialog" aria-expanded="false" aria-keyshortcuts="Control+K Meta+K Control+Space">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#lucide-search"></use></svg>
    </button>
    <button class="theme-toggle" id="themeToggleBtn" type="button" aria-label="Switch to light theme" data-tooltip="Switch to light theme">
      <svg class="icon" id="themeIcon" aria-hidden="true" focusable="false"><use id="themeIconUse" href="#lucide-sun"></use></svg>
    </button>
  </div>

  <dialog class="toc-drawer" id="tocDrawer" aria-labelledby="tocDrawerTitle">
    <div class="toc-drawer-header">
      <h2 id="tocDrawerTitle">Contents</h2>
      <button class="toc-close" id="tocClose" type="button" aria-label="Close" data-tooltip="Close">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#lucide-x"></use></svg>
      </button>
    </div>
    <div class="toc-drawer-body" id="tocDrawerBody"></div>
  </dialog>

  <dialog class="spotlight-dialog" id="spotlightDialog" aria-label="Search and commands">
    <div class="spotlight-search-field">
      <svg class="icon spotlight-search-icon" aria-hidden="true" focusable="false"><use href="#lucide-search"></use></svg>
      <input class="spotlight-input" id="spotlightInput" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="spotlightResults" aria-label="Search commands" autocomplete="off" spellcheck="false" placeholder="Search commands">
    </div>
    <ul class="spotlight-results" id="spotlightResults" role="listbox" aria-label="Commands"></ul>
    <div class="sr-only" id="spotlightStatus" aria-live="polite"></div>
  </dialog>

  <dialog class="modal-dialog shortcut-dialog" id="shortcutsDialog" aria-labelledby="shortcutsTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="shortcutsTitle">Keyboard shortcuts</h2>
      <button class="btn-icon modal-close" type="button" aria-label="Close" data-tooltip="Close">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#lucide-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <dl class="shortcut-list" id="shortcutList"></dl>
    </div>
  </dialog>

  <dialog class="modal-dialog topic-dialog" id="topicDialog" aria-labelledby="topicTitle" aria-describedby="topicAbout">
    <div class="modal-header">
      <h2 class="modal-title" id="topicTitle" tabindex="-1"></h2>
      <button class="btn-icon modal-close" id="topicClose" type="button" aria-label="Close" data-tooltip="Close">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#lucide-x"></use></svg>
      </button>
    </div>
    <div class="modal-body" id="topicBody">
      <div class="topic-meta">
        <span class="meta-tag" id="topicCode"></span>
        <span class="badge badge-nominal" id="topicRole"></span>
      </div>
      <p class="about" id="topicAbout"></p>
      <h3 class="dialog-heading">Covers</h3>
      <ul class="covers" id="topicCovers"></ul>
      <div id="topicFollowsBlock">
        <h3 class="dialog-heading">Follows</h3>
        <div class="related-list" id="topicFollows"></div>
      </div>
      <div id="topicLeadsBlock">
        <h3 class="dialog-heading">Leads to</h3>
        <div class="related-list" id="topicLeads"></div>
      </div>
      <p class="placeholder-note">No lessons or sources are attached yet.</p>
    </div>
    <div class="modal-footer" id="topicFooter" hidden>
      <button class="btn btn-secondary" id="bridgeBtn" type="button"></button>
    </div>
  </dialog>

  <div class="tooltip-bubble" id="tooltip" role="tooltip" popover="manual"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <p class="brand">Psych Roadmap</p>
      <div id="sidebarSlot">
        <div id="navRoot">
          <nav aria-label="Contents">
            <p class="nav-label">Contents</p>
            <ul class="nav-list" id="pathList"></ul>
          </nav>
        </div>
      </div>
    </aside>
    <main class="content" id="main">
      <noscript>
        <p class="callout callout-info"><span class="callout-label">Script required:</span> this map is drawn in the browser.</p>
      </noscript>
      <div id="view"></div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
